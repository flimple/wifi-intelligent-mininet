# .github/workflows/build-editor.yml
# Builds the editor (custom_edit.py) for Linux, Windows and macOS on GitHub's
# machines - Nuitka cannot build a Windows or macOS program on Ubuntu.
# Put this file in the repository at .github/workflows/build-editor.yml and
# set APP_DIR below to the folder that holds custom_edit.py.
# Start it from Ubuntu:  gh workflow run build-editor.yml
# Download the results:  gh run download --name miniedit-Windows (etc.)
name: Build editor

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  APP_DIR: src/top/libs     # folder of custom_edit.py inside the repository

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tools
        run: python -m pip install nuitka ordered-set zstandard pillow
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf python3-tk

      - name: Build (Linux)
        working-directory: ${{ env.APP_DIR }}
        if: runner.os == 'Linux'
        run: >
          python -m nuitka --onefile --enable-plugin=tk-inter
          --include-package=PIL --assume-yes-for-downloads
          --output-dir=dist --output-filename=miniedit custom_edit.py
          && tar -czf miniedit-linux.tar.gz -C dist miniedit
      - name: Build (Windows)
        working-directory: ${{ env.APP_DIR }}
        if: runner.os == 'Windows'
        run: >
          python -m nuitka --onefile --enable-plugin=tk-inter
          --include-package=PIL --assume-yes-for-downloads
          --windows-console-mode=disable
          --output-dir=dist --output-filename=miniedit.exe custom_edit.py
      - name: Build (macOS)
        working-directory: ${{ env.APP_DIR }}
        if: runner.os == 'macOS'
        run: >
          python -m nuitka --standalone --macos-create-app-bundle
          --macos-app-name=MiniEdit-WiFi --enable-plugin=tk-inter
          --include-package=PIL --assume-yes-for-downloads
          --output-dir=dist custom_edit.py
          && tar -czf miniedit-macos.tar.gz -C dist custom_edit.app

      - uses: actions/upload-artifact@v4
        with:
          name: miniedit-${{ runner.os }}
          path: |
            ${{ env.APP_DIR }}/miniedit-linux.tar.gz
            ${{ env.APP_DIR }}/dist/miniedit.exe
            ${{ env.APP_DIR }}/miniedit-macos.tar.gz
          if-no-files-found: ignore